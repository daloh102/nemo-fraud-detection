trainer:
  devices: 1
  num_nodes: 1
  accelerator: gpu
  precision: bf16-mixed
  logger: False
  enable_checkpointing: False
  max_epochs: 3
  max_steps: -1
  val_check_interval: 1.0

model:
  restore_from_path: "meta-llama/Llama-3.2-3B-Instruct"
  save_to: "results/fraud_detection_sft"  

  data:
    train_ds:
      file_names: ["data/sft/train.jsonl"]
      global_batch_size: 4
      micro_batch_size: 1
      shuffle: True
      num_workers: 2
      max_seq_length: 2048

    validation_ds:
      file_names: ["data/sft/validation.jsonl"]
      global_batch_size: 4
      micro_batch_size: 1
      shuffle: False
      num_workers: 2
      max_seq_length: 2048

  optim:
    name: adamw
    lr: 5e-6
    weight_decay: 0.01
    sched:
      name: CosineAnnealing
      warmup_steps: 20
      min_lr: 1e-7