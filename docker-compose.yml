networks:
  fraud-net:
    driver: bridge

services:
  nemo:
    build: .
    container_name: nemo-24.09
    networks:
      - fraud-net
    ports:
      - "8889:8889"  
    volumes:
      - /data:/data
    tty: true
    stdin_open: true
    command: bash
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  nemo-automodel:
    image: nvcr.io/nvidia/nemo-automodel:26.06.00
    working_dir: /workspace
    shm_size: "8g"
    ports:
      - "8887:8887"
    volumes:
      - .:/workspace
      - ./hf-cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:latest
    container_name: dcgm-exporter
    user: "0:0"         
    cap_add:
      - SYS_ADMIN
    networks:
      - fraud-net
    ports:
      - "9400:9400"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    networks:
      - fraud-net
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    networks:
      - fraud-net
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  grafana-data: